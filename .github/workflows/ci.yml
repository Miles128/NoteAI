name: CI

on:
  push:
    branches: [main, LangChain2]
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python and dependencies
        run: |
          uv python install 3.10
          uv sync --python 3.10 --extra dev --extra rag

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Verify one active PRD
        run: uv run python scripts/check_prd_single_source.py

  python-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python and dependencies
        run: |
          uv python install 3.10
          uv sync --python 3.10 --extra dev --extra rag

      - name: Mypy type check
        run: uv run mypy config modules prompts python utils

  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      NOTEAI_LOG_DIR: /tmp/noteai-logs
      NOTEAI_DISABLE_RERANKER: "1"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python and dependencies
        run: |
          uv python install 3.10
          uv sync --python 3.10 --extra dev --extra rag

      - name: Tests
        run: uv run pytest --tb=short -ra

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tiptap bundle
        run: npm run build:tiptap

      - name: Build webui bundle + highlight
        run: npm run build:webui:min && npm run build:highlight

      - name: Verify committed webui dist is current
        run: |
          git status --porcelain webui/dist/main.js webui/highlight.min.js webui/lib/tiptap-bundle.js
          test -z "$(git status --porcelain webui/dist/main.js webui/highlight.min.js webui/lib/tiptap-bundle.js)"

      - name: Syntax check webui/js
        run: |
          for f in webui/js/*.js; do
            node --check "$f" || exit 1
          done
          node --check webui/js/main.mjs || exit 1
          node --check webui/js/highlight-bundle-entry.mjs || exit 1

      - name: Test mcp-server
        working-directory: mcp-server
        run: |
          npm ci
          npm test

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python and dependencies
        run: |
          uv python install 3.10
          uv sync --python 3.10 --extra dev --extra rag

      - name: Verify RPC whitelist consistency (Python ↔ Rust ↔ api.js)
        run: uv run python scripts/sync_rpc_whitelist.py

  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build tiptap bundle
        run: npm run build:tiptap

      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cargo format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --lib --bins -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib
