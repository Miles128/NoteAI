name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build frontend bundles (tiptap + MCP runtime)
        run: |
          npm ci
          npm ci --prefix mcp-server
          npm run build:desktop

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python and dependencies
        run: |
          uv python install 3.10
          uv sync --python 3.10 --extra dev --extra rag

      - name: Bundle sidecar Python runtime
        run: bash scripts/bundle_sidecar_python.sh

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-cli-${{ runner.os }}-v1

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked

      - name: Build macOS bundle
        run: cargo tauri build

      - name: List artifacts
        run: |
          ls -lh src-tauri/target/release/bundle/dmg || true
          ls -lh src-tauri/target/release/bundle/macos || true

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: noteai-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
