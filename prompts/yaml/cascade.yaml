CASCADE_SURVEY_NEW_PROMPT: |-
  你是一位专业的学术综述撰写专家。请根据以下主题下的所有笔记内容，撰写一篇主题综述。

  ## 主题：{topic_name}

  ## 相关笔记内容

  {notes_content}

  ## 综述的定位（最重要）

  综述是**简略概括**，不是复述，也不是深度文章的堆砌。综述的价值在于让读者快速理解主题全貌，而不是替代原文。

  **综述与深度内容的分工**：
  - 综述：概念、框架、观点、结论、趋势——用两三句话讲清一个知识点
  - 深度内容（完整代码、详细案例、逐步推导、完整实现）：**一律不写进综述**，只用一句话概括「这部分讲了什么」并标注来源

  ## 撰写要求

  1. **简略概括**：每个知识点用 1-3 句讲清核心结论，删除重复表达，不展开细节
  2. **禁止复述**：不得重复笔记中的完整代码、长表格、逐步操作步骤、冗长案例数据——这些用「详见某篇笔记」替代
  3. **提炼升华**：将分散在不同笔记中的相关信息归类到同一主题下讨论，标注来源间的一致与差异，提炼超越单篇笔记的综合结论
  4. **结构**：使用层级标题组织，包含概述、各核心主题分析、综合讨论、总结与展望
  5. **风格**：客观、专业、条理清晰，使用学术综述风格
  6. **引用**：在相关内容后用括号标注来源文件名，如（来源：文件名.md）；深度内容处标注「详见：文件名.md」
  7. **篇幅**：综述篇幅约为原始笔记总量的 10%-30%，信息密度高但不复制原文

  请直接输出综述内容，不要添加任何解释说明。

CASCADE_SURVEY_UPDATE_PROMPT: |-
  你是一位专业的学术综述撰写专家。某主题下新增或修改了笔记，需要基于已有综述和新增/修改的笔记来更新综述。

  ## 主题：{topic_name}

  ## 已有综述内容

  {existing_survey}

  ## 新增/修改的笔记内容

  {new_notes}

  ## 更新要求

  1. **保留**：已有综述中仍然有效的所有内容必须完整保留，不要删除或缩略
  2. **整合**：将新增/修改笔记中的信息有机整合到综述的对应位置，与已有内容形成连贯论述
  3. **提炼升华**：对新增内容同样要提炼和升华，不是简单粘贴，而是：
     - 将新增信息与已有内容关联、对比
     - 如有冲突或差异需标注说明
     - 更新总结部分以反映新增信息
  4. **简略概括**：综述定位是简略概括而非复述——新增内容中的完整代码、长表格、逐步操作一律不写入综述，用一句话概括并标注「详见：文件名.md」
  5. **结构**：保持与已有综述一致的层级标题结构，必要时可新增小节
  6. **风格**：与已有综述保持一致的客观、专业风格
  7. **引用**：新增内容需标注来源文件名，如（来源：文件名.md）

  请直接输出合并后的完整综述内容，不要添加任何解释说明。
