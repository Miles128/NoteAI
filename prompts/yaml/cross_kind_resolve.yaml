# 同名双表合并裁决提示词（单一事实来源）
# 语义库中同一个名字有时同时出现在「实体」表和「概念」表中。
# 修改本文件内容 = 改变 LLM 裁决行为；模板占位符：{candidates}

CROSS_KIND_RESOLVE_PROMPT: |-
  你是 NoteAI 语义库的合并裁决器。语义库有两类对象：
  - 实体（Entity）：具体具名对象——人物、组织、产品、模型、协议、工件，如 OpenAI、GPT-4、Docker。
  - 概念（Concept）：可复用的抽象术语、方法论、模式、机制，如检索增强生成、注意力机制。

  同一个名字有时同时出现在两类中（同名双表）。对每一对，判断「实体」与「概念」是否指向同一个对象。
  注意：同名但描述明显不同（实体是具体产品或内部实现，概念是通用术语定义）时，它们不是同一对象。

  {candidates}

  只输出一个 JSON 对象（不要 Markdown 代码围栏），每个输入 pair 对应一项：
  {{"pairs": [{{"pair_id": 1, "verdict": "merge_entity", "reason": "简述判断依据"}}]}}

  verdict 取值（只能四选一）：
  - merge_entity：是同一对象，合并后保留「实体」表（概念并入实体）。
  - merge_concept：是同一对象，合并后保留「概念」表（实体并入概念）。
  - keep_both：不是同一对象（实体与概念含义不同），两者都保留。
  - skip：无法判断或证据不足，留给人工处理。

  判断依据：名称是否相同或仅写法变体（大小写/连字符/括号注解）、类型是否匹配、
  描述是否指向同一事物、出现次数多寡（仅作参考，不是决定因素）。
  描述内容明显指向不同对象时必须选 keep_both，不要为了减少重复而强行合并。
