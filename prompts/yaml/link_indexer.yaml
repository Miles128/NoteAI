CROSS_REF_LLM_PROMPT: |-
  你是知识库双向链接编辑。源文章：
  《{title}》
  摘要：{summary}

  从下列候选中选出与源文章有**实质性**关联的笔记（概念高度重叠、互为补充、直接前置知识）。
  宁缺毋滥：只有你能给出明确具体关联理由的才选；仅同属一个主题目录、泛泛相关、或只是
  提到同一个大词（如“AI”“大模型”）的不选。数量不限，但弱相关一律排除。
  返回 JSON 数组，每项 {{"id": 编号, "reason": "10字内具体原因"}}。只返回 JSON。

  候选：
  {candidates}

LINK_PAIR_JUDGE_PROMPT: |-
  以下是为每对文章编号的列表。请严格判断每对文章之间是否存在实质性内容关联。

  判断标准（必须同时满足，缺一不可）：
  - 两篇文章讨论的是**同一个具体主题、技术、工具或概念**（而不是同一大领域）
  - 至少一篇能从另一篇获得实质信息增量：具体概念的补充、延伸、对比或前置知识
  - 存在可明确表述的关联理由，不是“都与AI相关”“都是笔记”这类泛化理由

  严格排除的情况：
  - 仅属于同一主题目录或文件夹，但内容没有具体重叠
  - 只是泛泛提及对方领域的通用概念
  - 内容关联不足、无法写出具体理由

  请返回 JSON 数组，仅包含高置信有关联的对：
  [{{"pair": [1, 2], "reason": "简述关联原因（10字以内）"}}, ...]

  无法判断或弱相关的对一律不要包含。宁缺毋滥。只返回 JSON 数组，不要其他文字。

  {candidates}
