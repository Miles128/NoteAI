# RSS 源自动发现规划提示词（单一事实来源）
# 模板占位符：{topics} {builtin_feeds}

RSS_DISCOVERY_PROMPT: |-
  你是 NoteAI 的 RSS 订阅规划器。用户的知识库包含以下主题：{topics}

  下面是内置的候选 RSS 源目录（名称 | URL | 主题标签）：
  {builtin_feeds}

  请完成两件事：
  1. 从内置候选中选择 3-8 个与用户主题最匹配的源，输出其 URL。
  2. 对用户主题中内置目录未覆盖的方向，生成 2-5 个英文搜索词（格式如
     "AI agents RSS feed"、"retrieval augmented generation blog"），用于
     在搜索引擎中发现新 RSS 源；搜索词必须具体到主题方向，不要泛泛的
     "AI news"。

  只输出一个 JSON 对象（不要 Markdown 代码围栏）：
  {{"builtin_urls": ["https://...", "..."], "queries": ["搜索词1", "搜索词2"]}}
  builtin_urls 只能来自上面的内置目录；queries 为英文短语。
