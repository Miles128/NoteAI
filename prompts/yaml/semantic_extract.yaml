# 语义抽取提示词（单一事实来源）
# 迁移自 python/sidecar/semantic/extractor.py 的内联 f-string（PROMPT_VERSION=4）。
# 修改本文件内容 = 改变 LLM 抽取行为；若改动抽取语义，请同步递增 PROMPT_VERSION。
# 模板占位符：{block_id} {block_type} {heading_path} {content} {blocks} {object_name_rules}
# JSON 示例中的双花括号 {{ }} 经 .format() 后渲染为单花括号，与原文输出一致。

OBJECT_NAME_RULES: |-
  实体与概念名称必须是简洁规范名：
  - 先去除括号注释再输出：「RAG（检索增强生成）」「可灵(Kling)」应输出为「RAG」「可灵」；括号内容只是解释，不是名称的一部分。
  - 同一对象只输出一次：不要同时输出「RAG」与「RAG（检索增强生成）」这类变体；名称内不夹空格（「R A G」应写为「RAG」），统一用最简洁写法。
  - 实体与概念的区别：具名对象——人物、组织、公司、产品、模型、协议、标准、软件、文件类型（如 persona、person、organization、product、model、protocol、artifact）——一律放入 entities 并给出对应 type；抽象术语、方法论、模式、机制、能力、概念性框架（如「检索增强生成」「注意力机制」「思维链」「图神经网络」）放入 concepts。同一个对象只能出现在一个数组中：若它同时是产品名和通用术语，优先放 entities；拿不准时放 concepts 而非同时放两个数组。
  - 所有英文常用词不得输出：通用英语名词、动词、形容词、副词与功能词（如 amount、city、fetch、local、main、only、order、search、unit、user、write、data、model、system）一律不得抽取为实体或概念——无论它出现在什么上下文；只有规则预设的知名专名（知名库/工具/框架/算法/平台名，如 pandas、numpy、curl、jieba、matplotlib、pgvector、postgres、fastapi、pytorch、redis）可以作为对象输出，且必须是原文中作为专名使用的上下文。拿不准时宁可放弃抽取，不要输出普通英文词。
  - 不得输出：标题类短语（含「报告、指南、路线图、全景、速成、学习笔记、白皮书、专栏、合集、面试题、实践指南、入门教程、官方文档、源码解析、全梳理」等标题词）、@开头的引用（如 @file、@tool）、全大写下划线标记（如 AGENT_TRIGGERS）、带单位的数字短语（如 200K token、3步申请）、域名、点开头文件名（如 .env）、含标点的完整句子、纯符号或纯数字。

EXTRACTION_PROMPT: |-
  你是 NoteAI 的语义编译器。只抽取当前原文明确支持的知识，不补充外部知识。

  块 ID：{block_id}
  块类型：{block_type}
  章节：{heading_path}
  原文：
  <source>
  {content}
  </source>

  只输出一个 JSON 对象，不要 Markdown 代码围栏：
  {{
    "concepts": [{{"name": "概念名", "description": "原文内定义", "confidence": 0.0}}],
    "entities": [{{"name": "实体名", "type": "person|organization|product|model|protocol|artifact|other", "description": "原文内描述", "confidence": 0.0}}]
  }}

  规则：
  1. confidence 表示抽取把握，范围 0 到 1；无内容时返回对应空数组。
  2. 实体与概念必须是领域内稳定的具名对象或术语；文件名、章节标题、目录名、列表序号、纯数字/日期/版本号、命令参数（如 --port）、URL、邮箱、代码标识符、临时命名一律不得抽取为实体或概念。
  3. {object_name_rules}

BATCH_EXTRACTION_PROMPT: |-
  你是 NoteAI 的语义编译器。只抽取各 Block 原文明确支持的知识，不补充外部知识。

  {blocks}

  必须为每个输入 block_id 返回一项，不能遗漏、合并或改写 block_id。只输出 JSON：
  {{
    "blocks": [
      {{
        "block_id": "输入中的原始 ID",
        "concepts": [{{"name": "概念名", "description": "原文内定义", "confidence": 0.0}}],
        "entities": [{{"name": "实体名", "type": "person|organization|product|model|protocol|artifact|other", "description": "原文内描述", "confidence": 0.0}}]
      }}
    ]
  }}

  规则：
  1. 没有可抽取内容的 Block 也必须返回，两个数组均为空。
  2. confidence 表示抽取把握，范围 0 到 1；只输出 JSON。
  3. 实体与概念必须是领域内稳定的具名对象或术语；文件名、章节标题、目录名、列表序号、纯数字/日期/版本号、命令参数、URL、邮箱、代码标识符、临时命名一律不得抽取为实体或概念。
  4. {object_name_rules}

REPAIR_SUFFIX: |-
  你上次的输出未通过编译器校验：{error}
  <invalid-output>
  {invalid_output}
  </invalid-output>
  请只修复 JSON 结构，仍然只能使用 source 中的原文。只输出修复后的 JSON。
