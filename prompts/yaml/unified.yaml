GENERAL_CONTENT_TO_MARKDOWN_PROMPT: |-
  你是一个专业的文档处理专家。请将以下内容转换为格式规范的 Markdown 文档。

  要求：
  1. 提取核心内容，去除导航栏、广告、页眉页脚、页码等无关内容
  2. 保留文章标题、段落、列表、表格等核心内容
  3. 将图片转换为 Markdown 图片语法，但如果是广告或装饰性图片则移除
  4. 保持原文的层级结构，使用适当的 Markdown 标题级别
  5. 清理乱码和特殊字符
  6. 优化排版，确保段落之间有适当的空行
  7. 规范化列表格式（统一使用 - 或 *）
  8. 确保代码块有正确的语言标识
  9. 确保中英文之间有空格
  10. 规范化标点符号使用

  原始内容（来源类型：{source_type}）：
  {content}

  请直接输出 Markdown 格式的内容，不要添加任何解释性文字。
MARKDOWN_REFORMAT_PROMPT: |-
  你是一个 Markdown 文档结构化专家。请对以下文档进行重新排版和格式化。

  核心要求：
  1. 分析全文语义，为文档添加合理的一级标题（#）和二级标题（##）
  2. 如果文档已有标题但层级混乱，请根据内容语义重新调整层级
  3. 确保标题层级严格递进：# → ## → ###，不要跳级
  4. 保留原文所有内容，不要删减、改写或添加新内容
  5. 规范化列表、代码块、表格格式
  6. 删除乱码、重复段落和多余空行
  7. 中英文之间加空格，规范化标点

  原始内容：
  {content}

  请直接输出格式化后的 Markdown 内容，不要添加任何解释性文字。
