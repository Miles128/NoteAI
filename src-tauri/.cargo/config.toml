# Rust 编译 profile（项目级，随仓库生效）。
# 全局 ~/.cargo/config.toml 也有同类设置；这里显式写一份，保证换机器 / CI 一致。
# 参考: https://doc.rust-lang.org/cargo/reference/profiles.html

[profile.dev]
# 只要行号表；再 strip 掉调试段，依赖与自身产物都能小一大截
debug = "line-tables-only"
strip = "debuginfo"
# 共享 target-dir 下增量缓存会长期堆积（实测数百 MB）；Rust 侧只是薄壳，全量重编可接受
incremental = false

[profile.dev.package."*"]
# 依赖占 deps/ 体积的大头：不做完整调试信息，并轻度优化（运行时更快、体积更小）
opt-level = 1
debug = false
strip = "debuginfo"

# 清理方法（注意 target-dir 在本机被 ~/.cargo/config.toml 指向 ~/.cargo/target 共享目录）：
#   只清本项目产物：cargo clean -p noteai --manifest-path src-tauri/Cargo.toml
#   清空共享缓存（其他 Tauri 项目也会重编）：cargo clean --manifest-path src-tauri/Cargo.toml
