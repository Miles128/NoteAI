[package]
name = "noteai"
version = "1.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "io-util", "process", "time"] }
which = "7"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# NOTE: devtools is intentionally NOT in default, so release builds never
# ship the WebView inspector. Enable explicitly for local debugging:
#   cargo tauri dev -f devtools
default = []
devtools = ["tauri/devtools"]

[profile.release]
strip = true
lto = "thin"

[lib]
name = "noteai_lib"
# 桌面端只需要 rlib（bin 链接）与 cdylib；staticlib 是 iOS/Android 用的，
# 单这一项在 debug 下会多出数百 MB（target/debug 与 deps 各一份）
crate-type = ["cdylib", "rlib"]
